{% extends 'base.html' %}{% block title %}Create account | Trip Planner{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card"><div class="eyebrow">START YOUR JOURNEY</div><h1>Create your account</h1><p class="muted">Your trips and activities stay private to your account.</p><form method="post" class="form"><label>Username<input name="username" required minlength="3" maxlength="80" autocomplete="username" value="{{ request.form.get('username','') }}"></label><label>Password<input type="password" name="password" required minlength="6" autocomplete="new-password"><small>Use at least 6 characters.</small></label><button class="btn btn-primary full" type="submit">Create account →</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></section>{% endblock %}
