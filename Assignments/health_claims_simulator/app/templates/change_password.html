{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card"><div class="card-header py-3"><h1 class="h4 mb-0">Change Your Password</h1></div><div class="card-body"><p class="text-secondary">Change the password for your own account. Your new password must contain at least 8 characters.</p><form method="post" action="{{ url_for('auth.change_password') }}" autocomplete="off"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="current_password">Current password</label><input class="form-control" type="password" id="current_password" name="current_password" autocomplete="current-password" required></div><div class="mb-3"><label class="form-label" for="new_password">New password</label><input class="form-control" type="password" id="new_password" name="new_password" minlength="8" autocomplete="new-password" required></div><div class="mb-3"><label class="form-label" for="confirm_password">Confirm new password</label><input class="form-control" type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary" type="submit">Change Password</button></form></div></div></div></div>
{% endblock %}
