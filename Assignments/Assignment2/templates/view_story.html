<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{{ story['title'] }} - Story App</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
	</head>
	<body>
		<main>
			<nav>
				<a href="{{ url_for('home') }}">&larr; Back to Stories</a>
			</nav>

			<h1>{{ story['title'] }}</h1>
			<p><em>By {{ story['author'] }}</em></p>
			
			<div class="story-text">
				<p>{{ story['story'] }}</p>
			</div>

			<hr style="margin: 24px 0; border: 0; border-top: 1px solid #ddd;">

			<div>
				<a href="{{ url_for('edit_story', story_id=story_id) }}">Edit Story</a>
				&nbsp;|&nbsp;
				<form method="post" action="{{ url_for('delete_story', story_id=story_id) }}" class="inline-form" onsubmit="return confirm('Are you sure you want to delete this story?');">
					<button type="submit">Delete Story</button>
				</form>
			</div>
		</main>
	</body>
</html>
