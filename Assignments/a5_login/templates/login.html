{% extends 'base.html' %}
{% block title %}Log in | Community Events{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="panel form-panel auth-panel">
    <span class="eyebrow">Welcome back</span>
    <h1>Log in</h1>
    <p class="lead">Sign in to create events and reserve seats.</p>
    <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}">
      <div class="field"><label for="email">Email address *</label><input id="email" name="email" type="email" autocomplete="email" required autofocus></div>
      <div class="field auth-field"><label for="password">Password *</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn auth-submit" type="submit">Log in</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{{ url_for('signup') }}">Create one</a></p>
  </div>
</section>
{% endblock %}
