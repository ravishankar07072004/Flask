{% extends 'base.html' %}{% block title %}Suggest a place | Trip Planner{% endblock %}{% block content %}<section class="form-page"><a class="back-link" href="{{ url_for('explore') }}">← Back to Explore</a><div class="eyebrow">SHARE A DISCOVERY</div><h1>Suggest a place</h1><p class="muted">Help other travellers discover somewhere worth visiting.</p><div class="form-card"><form method="post" class="form"><label>Place name<input name="name" required maxlength="150" value="{{ request.form.get('name','') }}"></label><label>Destination / city<input name="destination" required maxlength="150" value="{{ request.form.get('destination','') }}"></label><label>Category<select name="category" required>{% for cat in ['Nature','Sightseeing','Food','Culture','Adventure','Shopping','Stay','Other'] %}<option value="{{ cat }}">{{ cat }}</option>{% endfor %}</select></label><label>Description<textarea name="description" required rows="4" placeholder="What makes this place worth visiting?">{{ request.form.get('description','') }}</textarea></label><button class="btn btn-primary full" type="submit">Publish suggestion →</button></form></div></section>{% endblock %}
